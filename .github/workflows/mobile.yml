name: Mobile

on:
  pull_request:
    paths:
      - "frontend-mobile/**"
      - "backend/src/**"
      - "backend/tests/fixtures/**"
      - "backend/mcp/tests/fixtures/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "frontend-mobile/**"
      - "backend/src/**"
      - "backend/tests/fixtures/**"
      - "backend/mcp/tests/fixtures/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend-mobile

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # Unit + component tests; the Detox device suites (e2e/) need a simulator and are not run here.
      - name: Unit tests (mocks)
        run: npx jest --ci

  # One live smoke job: the mobile service layer (no mocks) against a real backend.
  live-smoke:
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-mobile/package-lock.json

      - name: Install
        run: |
          pip install -r ../backend/requirements.txt
          npm ci

      - name: Start backend
        working-directory: backend
        env:
          GEMINI_API_KEY: ""
          MCP_ENABLED: "false"
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 2; done
          cat /tmp/api.log; exit 1

      - name: Live smoke test
        env:
          MAXERGY_LIVE_SMOKE: "1"
          EXPO_PUBLIC_USE_MOCKS: "false"
          EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: npx jest --ci __tests__/live.smoke.test.ts
