name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - "tests/**"
      - "documentation/data/**"
      - "data/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/**"
      - "tests/**"
      - "documentation/data/**"
      - "data/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Production energy-model tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/scripts
        run: |
          pytest tests/ \
            --ignore=tests/test_destatis_loader.py \
            --ignore=tests/test_price_backtesting.py \
            -q

      - name: Backend service and contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/scripts
        run: |
          pytest \
            scripts/test_forecasting_service.py \
            scripts/test_visualization_service.py \
            scripts/test_contract_schemas.py \
            -q

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt
        continue-on-error: true

      - name: Block committed env files and obvious secrets
        run: |
          set -euo pipefail
          test ! -f backend/.env
          if grep -RInE 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' \
            --include='*.py' backend/src backend/main.py; then
            echo "Forbidden private key material in backend sources."
            exit 1
          fi
          if grep -RInE 'AIza[0-9A-Za-z_-]{20,}' \
            --include='*.py' backend/src backend/main.py; then
            echo "Hardcoded Google API key in backend sources."
            exit 1
          fi

      - name: Build image
        run: docker build -f backend/DOCKERFILE -t maxergy-backend:ci backend

      - name: Scan image libraries
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: maxergy-backend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: library
          scanners: vuln
        continue-on-error: true
