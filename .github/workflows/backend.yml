name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "!backend/mcp/**"
      - "scripts/**"
      - "tests/**"
      - "documentation/data/**"
      - "data/**"
      - "frontend/src/services/fixtures/**"
      - "frontend-mobile/services/fixtures/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "!backend/mcp/**"
      - "scripts/**"
      - "tests/**"
      - "documentation/data/**"
      - "data/**"
      - "frontend/src/services/fixtures/**"
      - "frontend-mobile/services/fixtures/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/scripts
      # The advisor tests use a fake Gemini client; make sure nothing can reach the real API.
      GEMINI_API_KEY: ""
      MCP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Production energy-model tests
        run: |
          pytest tests/ \
            --ignore=tests/test_destatis_loader.py \
            --ignore=tests/test_price_backtesting.py \
            -q

      - name: Backend API tests (incl. recorded-fixture drift checks)
        run: pytest backend/tests backend/src/tests -q

      - name: Backend service and contract scripts
        run: |
          pytest \
            scripts/test_forecasting_service.py \
            scripts/test_visualization_service.py \
            scripts/test_contract_schemas.py \
            -q

  guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Repository guards
        run: |
          set -euo pipefail
          fail=0
          # Old product spelling (documentation/archive keeps the historical handoff note).
          if git grep -n -i "maxnergy" -- . ':!documentation/archive/**' ':!.github/workflows/backend.yml'; then
            echo "::error::Old product name found (use MAXergy)."; fail=1
          fi
          # The legacy engine lives in research/legacy only.
          if git grep -n "run_baseline_model" -- backend scripts; then
            echo "::error::Legacy engine referenced from backend/scripts."; fail=1
          fi
          # No machine-specific absolute paths in the backend.
          if git grep -n "/Users/" -- backend; then
            echo "::error::Absolute /Users/ path in backend."; fail=1
          fi
          exit $fail

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt
        continue-on-error: true

      - name: Block committed env files and obvious secrets
        run: |
          set -euo pipefail
          test ! -f backend/.env
          if grep -RInE 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' \
            --include='*.py' backend/src backend/main.py; then
            echo "Forbidden private key material in backend sources."
            exit 1
          fi
          if grep -RInE 'AIza[0-9A-Za-z_-]{20,}' \
            --include='*.py' backend/src backend/main.py; then
            echo "Hardcoded Google API key in backend sources."
            exit 1
          fi

      # Build context = repo root (the image needs backend/, scripts/ and data/), as on Railway.
      - name: Build image
        run: docker build -f backend/DOCKERFILE -t maxergy-backend:ci .

      # The Railway layout locally (API image + Postgres + MCP) and the staging smoke test, so
      # anything missing from the image (engine, data, benchmark profile, migrations) fails here.
      # Checks needing Google/Gemini keys report EXTERNAL (no keys in CI) and do not fail the job.
      - name: Container smoke test (staging stack)
        run: |
          set -euo pipefail
          docker compose -f backend/docker-compose.staging.yml up -d --build
          pip install requests
          python scripts/staging_smoke.py --api http://localhost:18000 --mcp http://localhost:18080 \
            --service-token staging-service-token --mcp-token staging-mcp-token --wait 240
          docker compose -f backend/docker-compose.staging.yml down -v

      - name: Scan image libraries
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: maxergy-backend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: library
          scanners: vuln
        continue-on-error: true
