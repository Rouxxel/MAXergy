[project]
name = "maxergy-mcp"
version = "0.1.0"
description = "MAXergy MCP service: address -> roof geometry -> PV production -> monthly-saving overview for the MAXergy app"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
maxergy-mcp = "maxergy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maxergy_mcp"]
